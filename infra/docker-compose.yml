version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coiffedom
      POSTGRES_USER: coiffedom
      POSTGRES_PASSWORD: coiffedom
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: infra/dockerfiles/api.Dockerfile
    env_file:
      - ../.env
    ports:
      - '4000:4000'
    depends_on:
      - postgres

  web:
    build:
      context: ..
      dockerfile: infra/dockerfiles/web.Dockerfile
    env_file:
      - ../.env
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pg_data:
